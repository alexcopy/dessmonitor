name: Build & Deploy dessmonitor

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  IMAGE_NAME: redcopy/dessmonitor     # docker‑repo

jobs:
# ─────────────────────────── 1️⃣  Build + Push ───────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke test
        run: python3 scripts/check-runtime-smoke.py

  build-push:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@v4

      - name: 🔧 Set up QEMU (multi‑arch, если нужно)
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📦 Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: 🚀 Update image tag in ArgoCD repo
        env:
          ARGO_DEPLOY_KEY: ${{ secrets.ARGO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$ARGO_DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone git@github.com:alexcopy/dess-argo.git
          cd dess-argo
          sed -i "s|redcopy/dessmonitor:.*|redcopy/dessmonitor:${{ github.sha }}|g"             manifests/apps/dessmonitor/deployment.yaml
          git config user.email "ci@dessmonitor"
          git config user.name "CI"
          git add manifests/apps/dessmonitor/deployment.yaml
          git commit -m "ci: deploy dessmonitor@${{ github.sha }}"
          git push