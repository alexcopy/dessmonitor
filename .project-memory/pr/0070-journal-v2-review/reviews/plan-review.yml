blockers:
  - id: B-01
    severity: blocker
    finding: "Database test isolation cannot be established: hard-coded default DSNs point at existing shared test databases, including the exact incident database. tests/test_online_output_learning.py line 26 sets DSN = postgresql://postgres:[REDACTED]@127.0.0.1:55439/easun_test (the incident container easun-test-pg on port 55439) and its opt-in Postgres suites (EASUN_TEST_POSTGRES=1) TRUNCATE inverter_metrics + adaptive_decision_journal, re-run migrations, and assert current_database() == 'easun_test'. tests/test_adaptive_journal_v2.py line 19 and tests/test_decision_log_battery_voltage.py line 175 default to postgresql://postgres:[REDACTED]@127.0.0.1:55440/easun_test and DROP TABLE IF EXISTS ... CASCADE on connect; tests/test_adaptive_decision_pagination.py line 164 defaults to 55440/dessmonitor_test. The only isolation checks are (a) current_database() endswith '_test' in the v2/benchmark tests, (b) equality to 'easun_test' in test_online_output_learning.py (no suffix check, and that name IS the incident database), and (c) benchmark_adaptive_journal_v2_storage.py endswith '_test' guard after an empty-DSN default that hard-fails. None of these create a new uniquely named disposable instance, none verify the container/endpoint identity, and any pre-existing database whose name ends in '_test' (or named easun_test on any port, including the incident 55439) is silently dropped/truncated. This violates the review instruction 'fail closed if an isolation check cannot be established' and leaves the earlier test-database incident reproducible."
    reproduction: "1) Leave the existing easun-test-pg container running on 127.0.0.1:55439. 2) Run: EASUN_TEST_POSTGRES=1 python -m unittest tests.test_online_output_learning. 3) asyncSetUp connects to the hard-coded DSN 55439/easun_test, asserts current_database() == 'easun_test', then executes TRUNCATE inverter_metrics, adaptive_decision_journal and re-applies migration 001 — destroying whatever the shared easun_test database currently contains. The same pattern (DROP TABLE IF EXISTS ... CASCADE) runs against 55440/easun_test from tests/test_adaptive_journal_v2.py and tests/test_decision_log_battery_voltage.py whenever the opt-in flags are set."
    minimum_correction: "Remove every hard-coded database DSN: change all defaults to '' (empty) so each Postgres-gated suite refuses to run without an explicit per-run DSN; require the operator to create a new, uniquely named disposable database (e.g. easun_journal_v2_review_<pid>_test) on an isolated container for each run; extend the isolation guard to verify the endpoint (host:port), database name, and container identity before any destructive SQL (reject if the DSN matches any known shared database, including easun_test on 55439 or 55440); and fail closed (skip, not truncate) whenever any of those checks cannot be established."
  - id: B-02
    severity: blocker
    finding: "Test defaults can silently fall back to the incident database without a unique disposable instance. The v2 and benchmark suites only check the database-name suffix, and test_online_output_learning.py does not even check the suffix. There is no mechanism that prevents a test run from connecting to a pre-existing easun_test database on 55439/55440; therefore 'never use production, staging or existing shared databases' cannot be proven by the code as written."
    reproduction: "Set JOURNAL_V2_LOCAL_POSTGRES=1 and leave JOURNAL_V2_TEST_DSN unset, with any PostgreSQL listening on 127.0.0.1:55440 that already has a database named easun_test; tests/test_adaptive_journal_v2.py connects and issues DROP TABLE IF EXISTS adaptive_worker_heartbeat, ... adaptive_decision_journal, inverter_metrics CASCADE before any validation beyond the name suffix."
    minimum_correction: "Same correction as B-01: empty defaults + explicit uniquely named disposable database + endpoint/container verification before destructive SQL; additionally make the current_database() guard reject the reserved names easun_test, dessmonitor_test and any database present on the incident ports."
  - id: B-03
    severity: blocker
    finding: "The Postgres-backed verification required by the review (migration apply-twice, cutover, rollback, 1000-evaluation flood test, concurrent-worker test, storage benchmark with VACUUM vs no-VACUUM, mixed-writer guard) could not be executed in this review environment: no disposable PostgreSQL instance was available, psql is not installed, and docker CLI access is denied by the tool sandbox. The instruction requires reproducing the benchmark on disposable PostgreSQL and confirming storage savings do not depend on manual VACUUM; that remains unverified."
    reproduction: "PYTHONPATH=/tmp/py313libs python3 -m unittest tests.test_adaptive_journal_v2.JournalV2PostgresTests -> all 12 scenarios skipped (JOURNAL_V2_LOCAL_POSTGRES not set); tests/benchmark_adaptive_journal_v2_storage.py exits with 'set JOURNAL_V2_TEST_DSN to a disposable *_test database' because no disposable database exists here."
    minimum_correction: "Before merge/activation, run the full JournalV2PostgresTests suite and the storage benchmark against a new uniquely named disposable PostgreSQL instance (per B-01), capture the benchmark summary (v1_total_relation_bytes, v2_total_relation_bytes for periodic_vacuum and no_vacuum, live_data_reduction_factor), and confirm no manual VACUUM is required for the savings. This is a verification blocker, not a code defect."
  - id: B-04
    severity: blocker
    finding: "No PLAN.md exists for this PR, so the plan-review gate cannot validate the documented plan structure (executable-first, validation strategy, scope) against a plan artifact. The design document app/control/ADAPTIVE_DECISION_JOURNAL_V2_DESIGN.md serves as the de-facto spec, but the required PLAN.md evidence row is empty (file absent)."
    reproduction: "find . -maxdepth 2 -name PLAN.md -> only .project-memory/pr/0001..0039/PLAN.md entries; no PLAN.md for the Journal v2 change."
    minimum_correction: "Create a PLAN.md for this PR (or record an operator/plan exemption in the PR directory) before the PR is merged, documenting scope, validation strategy, migration/cutover/rollback procedure, and known limitations, and have it reviewed."

warnings:
  - id: W-01
    severity: warning
    finding: "Unbounded event/heartbeat growth: adaptive_decision_events and adaptive_worker_heartbeat have no retention (design 'Known limitations' states 'Events and the heartbeat table have no retention'). Repetition rows follow the 30-day window; v1 journal retention unchanged. With only material transitions (~380 events / ~0.4 MB on a varied synthetic day per the design) and one heartbeat row per worker, this is an acceptable documented limitation rather than a merge blocker; a separate reviewed retention policy is required before long-running operation."
    evidence: "adaptive_journal_v2.py _evaluate_v2_locked deletes only adaptive_decision_journal and adaptive_state_repetitions rows older than RETENTION; no DELETE on adaptive_decision_events or adaptive_worker_heartbeat. migration 002 creates both tables without retention; design doc 'Known limitations' states 'Events and the heartbeat table have no retention.'"
  - id: W-02
    severity: warning
    finding: "Anti-flap event rules are deferred: DECISION_CHANGED / EVIDENCE_BLOCKED / EVIDENCE_RECOVERED / BATTERY_OBSERVATION_CHANGED are emitted on every transition without hysteresis, so rapid oscillation (e.g. HOLD <-> INSUFFICIENT_DATA across short telemetry outages) writes one event per transition. The ~380 events during a varied synthetic day correspond to meaningful transitions (candidate changes, two 15-min outages, mode alternation) rather than per-evaluation flooding — consistent with the design's own benchmark workload (1440 evaluations, 380 events). Acceptable documented limitation."
    evidence: "Design doc: 'Events record every learner state transition. Anti-flap rules are deferred: on a synthetic day with frequent candidate changes about 380 events were written (~0.4 MB).' _derive_events has no minimum-hold thresholds."
  - id: W-03
    severity: warning
    finding: "Worker identity defaults to socket.gethostname(), so multiple worker processes on the same host share one heartbeat row unless ADAPTIVE_WORKER_ID is set per instance; 'standby' losers from run_evaluation_v2 use GREATEST(last_heartbeat_at) so a lagging worker cannot roll a heartbeat backwards, but per-instance visibility on multi-worker hosts requires the env override."
    evidence: "adaptive_journal_v2.py worker_identity(): 'ADAPTIVE_WORKER_ID overrides; restarts keep it' falls back to hostname; heartbeat PK is worker_id."
  - id: W-04
    severity: warning
    finding: "Migration 002 contains no GRANT statements; worker/web roles must be granted manually per the design procedure. If the web role lacks SELECT on v2 tables, journal_v2_status raises and the decisions API returns 503 'Decision journal unavailable' (fail-closed, reported not silently misleading — correct behavior); if the worker role lacks write grants, evaluations fail and WORKER_FAILED heartbeats cannot persist (failure swallowed by learning_loop except-pass). Documented, but an easy operational footgun."
    evidence: "migrations/002_adaptive_decision_journal_v2.sql has no GRANT; README.md and design doc cutover step 2 require manual grants; web_routes.py returns 503 on exception."
  - id: W-05
    severity: warning
    finding: "The export endpoint still exports Journal v1 rows only, so a v2 operator cannot export post-cutover activity; documented limitation ('The export endpoint still exports Journal v1 rows only'). Backward compatible (existing v1 history/export unchanged, verified by JournalV2PostgresTests test 11 _assert_v1_api_and_export, pending Postgres execution)."
    evidence: "web_routes.py adaptive_decisions_export streams web_queries.stream_decisions (v1 table only); design doc Known limitations."
  - id: W-06
    severity: warning
    finding: "tests/test_online_output_learning.py (pre-existing, not modified by this PR) remains wired to the exact incident database 55439/easun_test and is the most likely original source of the earlier incident (its opt-in suites TRUNCATE the journal and metrics tables). Scope of the earlier incident (as reported, not independently re-established): an earlier test run against container easun-test-pg on port 55439 modified the existing local easun_test database; this review did not attempt any destructive restoration and did not access that container. No production database name appears anywhere in the tree; docker-compose.yml's only Postgres service is timescaledb (mldata/mluser) on 5432."
    evidence: "grep of tests/*.py for 55439/55440/easun_test/dessmonitor_test; docker-compose.yml timescaledb service; run.py uses DATABASE_URL env only; no other database references in scripts/."
  - id: W-07
    severity: warning
    finding: "Storage savings are designed to be independent of manual VACUUM (live value bytes drop from ~1000 full JSON entries to 1 snapshot + events + 1 repetition row; the benchmark measures periodic_vacuum vs no_vacuum disk totals), but the actual benchmark numbers were not reproduced in this review environment (blocker B-03)."
    evidence: "benchmark_adaptive_journal_v2_storage.py runs v1, v2_periodic_vacuum, v2_no_vacuum and reports reduction factors; execution blocked by absence of disposable PostgreSQL here."

