final_report:
  verdict: CHANGES REQUIRED
  database_test_isolation: "BLOCKED - hard-coded DSNs default to existing shared test databases (55439/easun_test in test_online_output_learning.py - the incident database - and 55440/easun_test, 55440/dessmonitor_test in the new suites/benchmark); guards are database-name-suffix or exact-name only; no unique disposable instance creation and no endpoint/container identity verification; fail-closed isolation is not established (B-01, B-02)."
  earlier_test_database_incident: "Mechanism identified: opt-in EASUN_TEST_POSTGRES suites in tests/test_online_output_learning.py connect to the hard-coded 55439/easun_test and TRUNCATE the journal/metrics tables; that hard-coded default remains in the tree, so the incident is still reproducible; no restoration attempted (not authorized); incident container not accessed (W-06, B-01)."
  durable_state: "PASS (code inspection + unit tests): adaptive_learning_state is outside retention, read under advisory lock + FOR UPDATE, strictly validated (LearnerStateInvalid/LearnerStateMissing raise, never reset); failures never touch learner state (record_worker_failure_v2); restart preserves proposal/cooldown (test 8), corrupt durable state fails closed (test 9), rollback hands state back via v1 handoff entry (test 11). Postgres executions still pending (B-03)."
  event_deduplication: "PASS (code + tests): deterministic event IDs derive from the locked state revision (never wall time); identical outcome -> no event, repetition row count increments (test 1: 1000 identical -> 1 repetition row, evaluation_count 1000, 0 new evidence); genuine vs cached evidence counted separately (test 2); retries of committed evaluations are no-ops via last_evaluated_at guard (test 10)."
  heartbeat: "PASS: adaptive_worker_heartbeat updates independently of event insertion; WORKER_FAILED/RECOVERED emitted only on health transitions; failing heartbeat keeps consecutive_failures and last_success; standby rows keep liveness for lock-losers and replays (tests 4, 6, 10); per-host identity collision noted (W-03)."
  concurrency: "PASS (code + tests): pg_try_advisory_xact_lock serializes evaluation; state row FOR UPDATE + revision compare (status != UPDATE 1 raises); concurrent workers cannot duplicate confirmations/events (test 4: sum(results)==1, single HYPOTHESIS_CONFIRMED, no duplicate (event_type, state_revision) pairs); sequential alternating workers do not duplicate events (test 5)."
  migration: "PASS (SQL inspection): 002 is additive and idempotent (CREATE TABLE IF NOT EXISTS, INSERT ... ON CONFLICT DO NOTHING, CREATE OR REPLACE FUNCTION, DROP TRIGGER IF EXISTS + CREATE TRIGGER; transaction BEGIN/COMMIT; refuses without 001); applying it does NOT activate v2 (control row created in mode 'v1'); down script refuses while mode='v2' and removes only v2 objects. Postgres execution pending (B-03)."
  cutover: "PASS (code + tests): explicit operator command only (scripts/adaptive_journal_v2.py cutover --confirm); takes the advisory lock (waits for in-flight evaluation); seeds from newest v1 entry carrying proposal_state, fails closed on missing/corrupt/incompatible state unless --allow-empty-state; mode flip and state write in one transaction; baseline outcome from last v1 entry so a post-cutover transition is recorded; snapshot cleared on cutover so a stale v2 snapshot is never shown. Execution pending (B-03)."
  rollback: "PASS (code + tests): rollback_to_v1 sets mode to 'v1' then inserts one v1 handoff entry carrying the durable proposal_state (same transaction), so v1 resumes with the same cooldown/pending; down migration refuses while v2 active; retried rollback returns ALREADY_V1; re-cutover re-reads the handoff state. Execution pending (B-03)."
  v1_compatibility: "PASS (code + tests): v1 continues working before cutover (journal_mode returns 'v1' when control row absent or mode v1); run_evaluation/_record_worker_failure stand down when v2 active; guard trigger rejects old-replica v1 INSERT/UPDATE only while mode='v2' (DELETE for retention still allowed); v1 rows stay readable; v1 30-day retention unchanged; API/export over v1 rows remain backward compatible (JournalV2PostgresTests test 11; Postgres execution pending)."
  api_and_ui: "PASS (code + tests): in v2 mode latest_decision comes only from adaptive_latest_evaluation (latest_row forced None); v1 rows never shown as current; 5-minute snapshot freshness shown via snapshot_evaluated_at/last_evaluated_at/evaluations_since_snapshot (test 12, UI tests 3/3); repetition counters rendered; API/database failure returns 503 'Decision journal unavailable' (fail-closed, reported); without web SELECT grants the same 503 path applies (W-04)."
  storage: "PARTIALLY VERIFIED - design/benchmark code separates logical event count, live payload (pg_column_size sums), allocated disk (pg_total_relation_size after VACUUM ANALYZE) and VACUUM effects (periodic vs no-vacuum runs); savings come from row-count reduction (1000 full entries -> 1 snapshot + repetition row), independent of manual VACUUM by construction; benchmark numbers NOT reproduced (B-03); unbounded events/heartbeat growth is an acceptable documented limitation (W-01)."
  hardware_read_only: "PASS: no hardware writes added (no inverter/Tuya/relay code in v2 files; hardware_write_attempted = FALSE CHECK guards on both v2 tables); battery calculations and threshold decisions unchanged (evaluate_collected_history untouched by this PR's diff); adaptive learning remains enabled by the unchanged ADAPTIVE_OUTPUT_LEARNING_ENABLED flag; all proposals remain NON_ACTIONABLE; no production access required by tests/scripts."
  complete_blocker_list: "B-01: hard-coded test DSNs default to existing shared/incident databases (55439/easun_test, 55440/easun_test, 55440/dessmonitor_test) and isolation is name-suffix-only, so fail-closed isolation is not established and the earlier incident remains reproducible. B-02: test/benchmark defaults can silently fall back to a pre-existing *_test database without endpoint/container verification. B-03: Postgres-backed verification (migration, cutover/rollback, 1000-evaluation flood, concurrency, mixed-writer, storage benchmark with/without VACUUM) could not be executed in this environment - no disposable PostgreSQL available - so those claims remain unverified. B-04: no PLAN.md exists for this PR (plan-review gate evidence absent)."
  warnings: "W-01 unbounded events/heartbeat growth without retention (documented, acceptable); W-02 anti-flap rules deferred (~380 meaningful transition events on varied day, documented); W-03 worker identity defaults to hostname (per-instance rows need ADAPTIVE_WORKER_ID); W-04 no GRANT statements in migration 002 (manual grants required; fail-closed 503 if web grants absent); W-05 export remains v1-only (documented); W-06 incident mechanism identified in pre-existing tests/test_online_output_learning.py hard-coded DSN (untouched by this PR); W-07 benchmark numbers not reproduced here."
  test_results: "Python: 424 tests OK (67 skipped), including the 4 always-run v2 unit tests. Node: 62 UI tests pass (5 suites). py_compile: OK. Postgres scenarios + storage benchmark: pending disposable database (B-03). Weather aiohttp fixture failure: pre-existing baseline, not a regression."
  safe_to_merge: "NO - CHANGES REQUIRED: hard-coded shared/incident test database defaults and suffix-only isolation guards must be corrected (B-01/B-02), Postgres verification must be executed on a uniquely named disposable database (B-03), and a PLAN.md for the PR must exist (B-04)."
  safe_to_activate: "NOT YET VERIFIED - cutover/rollback/mixed-writer behavior is code- and test-sound but has not been executed against a disposable PostgreSQL instance in this review; activation additionally requires the operator procedure (migration 002 + role grants + explicit cutover) and must not run until B-01/B-02 are fixed and B-03 is verified."
