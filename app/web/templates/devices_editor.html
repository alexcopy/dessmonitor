<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dessmonitor — Device Editor</title>
    <link rel="stylesheet" href="/static/vendor/bulma/1.0.4/bulma.min.css">
    <link rel="stylesheet" href="/static/dashboard.css">
    <link rel="stylesheet" href="/static/devices-editor.css">
    <script defer src="/static/devices-editor.js"></script>
</head>
<body>

<nav class="dm-nav" role="banner">
    <div class="dm-nav-brand">dess<span>monitor</span></div>
        <div class="dm-nav-links">
        <a href="/" class="dm-nav-link">
            <span class="nav-icon">&#9632;</span> Dashboard
        </a>
        <a href="/analytics" class="dm-nav-link">
            <span class="nav-icon">&#9776;</span> Analytics
        </a>
        <a href="/alarms" class="dm-nav-link">
            <span class="nav-icon">&#9888;</span> Alarms
        </a>
        <a href="/controls" class="dm-nav-link">
            <span class="nav-icon">&#9881;</span> Controls
        </a>
        <a href="/settings" class="dm-nav-link active">
            <span class="nav-icon">&#9874;</span> Settings
        </a>
    </div>
    <div class="dm-nav-right">
        <span class="dm-badge degraded" id="nav-status-badge">&#9888; API</span>
        <span class="nav-username">Authenticated as <strong>{{ username }}</strong></span>
        <form method="post" action="/logout" class="logout-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="logout-btn">Sign Out</button>
        </form>
    </div>
</nav>

<main class="dm-main">

    <div class="dm-analytics-header">
        <div>
            <h1 class="dm-analytics-title dm-mono">Device Editor</h1>
            <div class="dm-analytics-sub">Edit device configuration — hot-reloads without restart</div>
        </div>
        <div class="de-header-actions">
            <button class="de-btn de-btn-secondary" id="btn-reload">
                &#8635; Reload from file
            </button>
            <button class="de-btn de-btn-primary" id="btn-save">
                &#10003; Save &amp; Apply
            </button>
        </div>
    </div>

    <!-- STATUS BAR -->
    <div class="de-status-bar" id="status-bar">
        <span id="status-text">Loading devices...</span>
    </div>

    <!-- CSRF token for JS -->
    <span id="csrf-token" class="dm-js-hidden">{{ csrf_token }}</span>

    <!-- DEVICES LIST -->
    <div id="devices-container">
        <!-- Populated by devices-editor.js -->
    </div>

    <!-- ADD DEVICE BUTTON -->
    <div class="de-add-row">
        <button class="de-btn de-btn-ghost" id="btn-add-device">
            &#43; Add Device
        </button>
    </div>

</main>

</body>
</html>
